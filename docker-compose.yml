services:
  # Production build served by nginx. `docker compose up web`
  web:
    build:
      context: .
      target: runtime
      args:
        # Empty = same origin; nginx proxies /api/ to API_ORIGIN below.
        VITE_API_URL: "${VITE_API_URL-}"
        # `VITE_DEMO=1 docker compose up --build web` runs the whole app on demo
        # fixtures, with no backend and no proxy behind it.
        VITE_DEMO: "${VITE_DEMO-0}"
    image: matchpoint-frontend
    environment:
      # Where nginx forwards /api/. On Linux, host.docker.internal needs the extra_hosts entry.
      API_ORIGIN: "${API_ORIGIN:-http://host.docker.internal:8000}"
      # Widen only if you build with an absolute VITE_API_URL (cross-origin API calls).
      CSP_CONNECT_SRC: "${CSP_CONNECT_SRC:-'self'}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  # Vite dev server with hot reload. `docker compose --profile dev up dev`
  # Source is bind-mounted; node_modules stays inside the container so the host's
  # copy (or absence of one) can't shadow it.
  dev:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "${DEV_PORT:-5173}:5173"
    profiles: ["dev"]

volumes:
  node_modules:
