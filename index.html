<!-- Applies the stored theme before first paint so there is no flash of the wrong one. -->
<script>
(function () {
  var th = localStorage.getItem('mp_theme');
  if (!th) {
    th = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    localStorage.setItem('mp_theme', th);
  }
  document.documentElement.setAttribute('data-theme', th);
  document.documentElement.lang = localStorage.getItem('mp_lang') || 'en';
})();
</script>
