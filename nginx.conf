server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # NB: do not add a `types { }` block here — it REPLACES nginx's whole mime.types
    # map rather than extending it, which would serve every .js/.css as
    # application/octet-stream and break module loading. The one missing mapping
    # (.webmanifest) is set with default_type on its own location below.

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Vite fingerprints these filenames, so a changed file always has a new URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # The entry point and the service worker must never be cached: a stale copy of
    # either pins clients to an old build that can never update itself.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    # nginx's mime.types has no entry for .webmanifest, so set it explicitly here or
    # the browser gets application/octet-stream and ignores the manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Single-page app: anything unmatched falls back to the shell. Routing itself is
    # hash-based (#/clubs), so this mainly covers /?source=pwa and deep refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
