# Rendered by the nginx image's entrypoint (envsubst) from /etc/nginx/templates/.
# Only ${API_ORIGIN}, ${CSP_CONNECT_SRC} and ${CSP_IMG_SRC} are substituted —
# NGINX_ENVSUBST_FILTER in the Dockerfile restricts it, otherwise envsubst would also
# eat $uri, $host and friends.

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # NB: do not add a `types { }` block here — it REPLACES nginx's whole mime.types
    # map rather than extending it, which would serve every .js/.css as
    # application/octet-stream and break module loading. The one missing mapping
    # (.webmanifest) is set with default_type on its own location below.

    # Security headers. These are inherited by every location that does NOT call add_header
    # itself — nginx's add_header does not merge across levels, so any location adding a
    # header of its own must repeat these (see /assets/ below).
    add_header X-Frame-Options        "DENY"                            always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src ${CSP_IMG_SRC}; connect-src ${CSP_CONNECT_SRC}; manifest-src 'self'" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # Same-origin API proxy. With VITE_API_URL empty at build time the app calls /api/…
    # on its own origin, so there is no CORS preflight and no third-party cookie story.
    location /api/ {
        proxy_pass         ${API_ORIGIN};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Vite fingerprints these filenames, so a changed file always has a new URL.
    # `immutable` needs add_header, which is why the security headers are repeated here.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # `expires` sets Cache-Control without add_header, so the server-level security
    # headers survive in the locations below.
    location /icons/ {
        expires 30d;
        access_log off;
    }

    # The entry point and the service worker must never be cached: a stale copy of
    # either pins clients to an old build that can never update itself.
    location = /index.html {
        expires -1;
    }
    location = /sw.js {
        expires -1;
    }
    location = /registerSW.js {
        expires -1;
    }
    # nginx's mime.types has no entry for .webmanifest, so set it explicitly here or
    # the browser gets application/octet-stream and ignores the manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # Single-page app: anything unmatched falls back to the shell. Routing itself is
    # hash-based (#/clubs), so this mainly covers /?source=pwa and deep refreshes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
